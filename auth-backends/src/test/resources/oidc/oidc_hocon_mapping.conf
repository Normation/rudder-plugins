#
# Same registration as `oidc_tenants.properties`, but in HOCON syntax, which allows to use an
# IdP entitlement that can not be a java properties key (typically an LDAP DN, because of '=', ',' and '.')
# and to grant several Rudder roles/tenants with one entitlement.
#
rudder.auth.oauth2.provider.registrations = someidp

rudder.auth.oauth2.provider.someidp {
  name = "Some ID"
  ui.infoMessage = "Hey, log in to Some Idp!"
  client {
    id = xxxClientIdxxx
    secret = xxxClientPassxxx
    redirect = "{baseUrl}/login/oauth2/code/{registrationId}"
  }
  scope = "openid email profile groups"
  userNameAttributeName = email
  uri {
    auth = "https://someidp/oauth2/v1/authorize"
    token = "https://someidp/oauth2/v1/token"
    userInfo = "https://someidp/oauth2/v1/userinfo"
    jwkSet = "https://someidp/oauth2/v1/keys"
  }
  grantType = authorization_code
  authMethod = basic
  enableProvisioning = true

  roles {
    enabled = true
    attribute = customroles
    override = true
    mapping {
      restricted = true
      entitlements {
        # one entitlement can grant several Rudder roles
        "CN=AAAA-BBBBB,OU=Groups,OU=_IT,OU=BB-DD,OU=UUU-XXXX-YY,DC=ee,DC=if,DC=ttttt,DC=uuu" = ["administrator", "read_only"]
        # a scalar value is still accepted
        rudder_readonly = read_only
      }
    }
  }

  tenants {
    enabled = true
    attribute = customtenants
    override = true
    mapping {
      restricted = true
      entitlements {
        # the case we can't express with the java properties syntax: an LDAP DN granting several tenants
        "CN=AAAA-BBBBB,OU=Groups,OU=_IT,OU=BB-DD,OU=UUU-XXXX-YY,DC=ee,DC=if,DC=ttttt,DC=uuu" = ["TA", "TB"]
        # special tenants '*' (all) and '-' (none) need to be quoted, and quotes are not part of the key
        "CN=AAAA-BBBBB,OU=Groups,OU=_IT,OU=BB-DD,OU=Admin" = "*"
        "CN=CCCC-DDDDD,OU=Groups,OU=_IT,OU=BB-DD,OU=Nobody" = ["-"]
        rudder_TA = TA
      }
      # deprecated form, kept for compatibility: several Rudder tenants can be granted by the same entitlement
      reverseEntitlements {
        TC = "CN=EEEE-FFFFF,OU=Groups,OU=_IT,OU=BB-DD,OU=Dev"
        TD = ["CN=EEEE-FFFFF,OU=Groups,OU=_IT,OU=BB-DD,OU=Dev"]
      }
    }
  }
}
